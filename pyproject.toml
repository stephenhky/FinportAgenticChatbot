[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finport-agentic-chatbot"
version = "0.2.0"
description = "A Telegram bot with agentic AI capabilities for financial portfolio analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyTelegramBotAPI",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-aws",
    "langgraph",
    "langchain-mcp-adapters",
    "mcp",
    "python-dotenv",
    "boto3",
]

[project.scripts]
finport-chat = "src.cli:main_cli"
finport-cli = "src.cli:main_cli"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

